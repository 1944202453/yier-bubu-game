<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>一二布布 · 常想一二</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #fce4ec;
  overflow: hidden;
  height: 100vh; width: 100vw;
  font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  touch-action: none;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
}

/* ── Game container ── */
#game-container {
  position: relative;
  width: 100vw; height: 100vh;
  max-width: 500px; max-height: 850px;
  margin: 0 auto;
  overflow: hidden;
  background: linear-gradient(180deg, #e8f4f8 0%, #fce4ec 50%, #f8e8f0 100%);
}
#game-container.full { max-width: 100vw; max-height: 100vh; }

canvas {
  position: absolute; top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
}

/* ── Character sprites (on top of canvas) ── */
#player-sprite {
  position: absolute;
  pointer-events: none;
  transition: none;
  z-index: 5;
}
#bubu-sprite {
  position: absolute;
  pointer-events: none;
  z-index: 4;
}
#bubu-label {
  position: absolute;
  pointer-events: none;
  z-index: 4;
  text-align: center;
  font-size: clamp(10px, 2.5vw, 14px);
  color: #8b5e3c;
  font-weight: bold;
  text-shadow: 0 0 6px rgba(255,255,255,0.8);
}

/* ── Start & Game Over screens ── */
.overlay {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  pointer-events: none; z-index: 20;
}
.overlay.active { pointer-events: auto; }

#start-screen {
  background: rgba(255,235,238,0.94);
  text-align: center;
  transition: opacity 0.5s;
}
#start-screen.hidden { opacity: 0; pointer-events: none; }
#start-screen .preview-chars {
  display: flex; justify-content: center; align-items: center;
  gap: 10px; margin-bottom: 0.5em;
}
#start-screen .preview-chars img {
  height: clamp(60px, 15vw, 100px);
  image-rendering: auto;
}
#start-screen h1 {
  font-size: clamp(2rem, 6vw, 3.3rem);
  color: #d4687a;
  margin-bottom: 0.2em;
  text-shadow: 2px 2px 0 rgba(255,255,255,0.8);
}
#start-screen .sub {
  font-size: clamp(0.85rem, 2.5vw, 1.2rem);
  color: #b0806a;
  margin-bottom: 0.6em;
}
#start-screen .meaning {
  font-size: clamp(0.7rem, 2vw, 0.95rem);
  color: #c09080;
  max-width: 85%;
  line-height: 1.8;
  margin-bottom: 1.5em;
}
#start-btn {
  padding: 14px 50px; font-size: 1.3rem;
  background: linear-gradient(135deg, #f8a4b8, #e8788a);
  color: #fff; border: none; border-radius: 50px;
  cursor: pointer; letter-spacing: 0.2em;
  box-shadow: 0 4px 20px rgba(232,120,138,0.4);
  transition: transform 0.2s, box-shadow 0.2s;
  font-family: inherit;
}
#start-btn:hover { transform: scale(1.05); }
#start-btn:active { transform: scale(0.97); }

#game-over {
  background: rgba(255,235,238,0.9);
  text-align: center;
  opacity: 0; transition: opacity 0.6s;
}
#game-over.active { opacity: 1; pointer-events: auto; }
#game-over h2 {
  font-size: clamp(1.5rem, 5vw, 2.5rem);
  color: #d4687a; margin-bottom: 0.3em;
}
#game-over .score-final {
  font-size: clamp(2rem, 8vw, 4rem);
  color: #b05060; font-weight: bold;
  margin-bottom: 0.2em;
}
#game-over .score-label { color: #b0806a; font-size: 0.9rem; margin-bottom: 0.5em; }
#game-over .high-score { color: #c08070; font-size: 0.85rem; margin-bottom: 1.2em; }
#restart-btn {
  padding: 12px 40px; font-size: 1.1rem;
  background: linear-gradient(135deg, #f8a4b8, #e8788a);
  color: #fff; border: none; border-radius: 50px;
  cursor: pointer; letter-spacing: 0.15em;
  box-shadow: 0 4px 16px rgba(232,120,138,0.4);
  transition: transform 0.2s;
  font-family: inherit;
}
#restart-btn:hover { transform: scale(1.05); }
#restart-btn:active { transform: scale(0.97); }

/* ── HUD overlay ── */
#hud {
  position: absolute; top: 0; left: 0; width: 100%;
  padding: 8px 14px;
  display: flex; justify-content: space-between; align-items: center;
  z-index: 15; pointer-events: none;
  font-size: clamp(14px, 3.5vw, 20px);
}
#hud .score-text { color: #c07080; font-weight: bold; }
#hud .lives-text { letter-spacing: 2px; }
#hud .shield-text {
  position: absolute; left: 50%; transform: translateX(-50%);
  color: #5b9bd5; font-size: clamp(11px, 2.5vw, 15px);
  white-space: nowrap;
}
</style>
</head>
<body>

<div id="game-container">
  <canvas id="game"></canvas>
  <img id="player-sprite" src="一二1.gif" alt="一二">
  <img id="bubu-sprite" src="布布1.gif" alt="布布">
  <div id="bubu-label"></div>

  <!-- HUD -->
  <div id="hud">
    <span class="score-text" id="hud-score">💛 0</span>
    <span class="shield-text" id="hud-shield"></span>
    <span class="lives-text" id="hud-lives">❤️❤️❤️</span>
  </div>

  <!-- Start Screen -->
  <div id="start-screen" class="overlay active">
    <div class="preview-chars">
      <img src="一二1.gif" alt="一二">
      <img src="布布1.gif" alt="布布">
    </div>
    <h1>常想一二</h1>
    <p class="sub">一二布布 · 治愈小游戏</p>
    <p class="meaning">人生不如意十之八九<br>常想一二，不思八九</p>
    <button id="start-btn" onclick="startGame()">开 始 游 戏</button>
  </div>

  <!-- Game Over -->
  <div id="game-over" class="overlay">
    <h2>游戏结束</h2>
    <div class="score-final" id="final-score">0</div>
    <div class="score-label">收集的幸福</div>
    <div class="high-score" id="high-score-text">最高纪录：0</div>
    <button id="restart-btn" onclick="restartGame()">再 来 一 次</button>
  </div>
</div>

<script>
// ═══════════════════════════════════════
//  DOM ELEMENTS
// ═══════════════════════════════════════
const container = document.getElementById('game-container');
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const playerSprite = document.getElementById('player-sprite');
const bubuSprite = document.getElementById('bubu-sprite');
const bubuLabel = document.getElementById('bubu-label');
const hudScore = document.getElementById('hud-score');
const hudLives = document.getElementById('hud-lives');
const hudShield = document.getElementById('hud-shield');

// ═══════════════════════════════════════
//  CANVAS SIZE
// ═══════════════════════════════════════
let W, H;

function resize() {
  const rect = container.getBoundingClientRect();
  W = rect.width;
  H = rect.height;
  canvas.width = W;
  canvas.height = H;
}
resize();
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 200));

// ═══════════════════════════════════════
//  CHARACTER IMAGES
// ═══════════════════════════════════════
const yierImgs = ['一二1.gif', '一二二.gif'];
const bubuImgs = ['布布1.gif', '布布2.gif'];

let yierIdx = 0;
let bubuIdx = 0;
let animTimer = 0;

function switchPlayerFrame() {
  yierIdx = (yierIdx + 1) % yierImgs.length;
  playerSprite.src = yierImgs[yierIdx];
}
function switchBubuFrame() {
  bubuIdx = (bubuIdx + 1) % bubuImgs.length;
  bubuSprite.src = bubuImgs[bubuIdx];
}

// ═══════════════════════════════════════
//  SOUND
// ═══════════════════════════════════════
let audioCtx = null;
function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function playSound(freq, type, duration, vol = 0.1) {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t);
  gain.gain.setValueAtTime(vol, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + duration);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(t); osc.stop(t + duration);
}
function sfxCollect() { playSound(880, 'sine', 0.15); setTimeout(() => playSound(1100, 'sine', 0.12), 80); }
function sfxHit() { playSound(150, 'triangle', 0.25, 0.08); }
function sfxPowerUp() { playSound(660, 'sine', 0.1); setTimeout(() => playSound(880, 'sine', 0.1), 100); setTimeout(() => playSound(1100, 'sine', 0.15), 200); }
function sfxGameOver() { playSound(200, 'sawtooth', 0.4, 0.06); setTimeout(() => playSound(150, 'sawtooth', 0.5, 0.06), 200); }

// ═══════════════════════════════════════
//  GAME STATE
// ═══════════════════════════════════════
const STATE = { IDLE: 0, PLAYING: 1, OVER: 2 };
let gameState = STATE.IDLE;
let score = 0;
let lives = 3;
let highScore = parseInt(localStorage.getItem('bubu_highscore') || '0');
let frame = 0;
let invincible = 0;

// ═══════════════════════════════════════
//  PLAYER
// ═══════════════════════════════════════
const player = {
  x: 0, y: 0,
  w: 80, h: 90,   // display size
  speed: 0,
  targetX: 0,
};

function resetPlayer() {
  player.x = W / 2;
  player.y = H * 0.82;
  player.speed = W * 0.008;
  player.targetX = player.x;
  playerSprite.src = yierImgs[0];
  yierIdx = 0;
  updatePlayerSprite();
}

function updatePlayerSprite() {
  const scaleX = player.w / 100; // base sizing
  const scaleY = player.h / 100;
  playerSprite.style.width = player.w + 'px';
  playerSprite.style.height = player.h + 'px';
  playerSprite.style.left = (player.x - player.w / 2) + 'px';
  playerSprite.style.top = (player.y - player.h / 2) + 'px';

  // Invisible during invincibility blink
  if (invincible > 0 && Math.floor(invincible / 8) % 2 === 0) {
    playerSprite.style.opacity = '0.3';
  } else {
    playerSprite.style.opacity = '1';
  }
}

// ═══════════════════════════════════════
//  FALLING ITEMS
// ═══════════════════════════════════════
const GOOD_ITEMS = [
  { emoji: '❤️', label: 'heart', points: 1 },
  { emoji: '⭐', label: 'star', points: 2 },
  { emoji: '🌸', label: 'flower', points: 1 },
  { emoji: '🍀', label: 'clover', points: 3 },
  { emoji: '🎀', label: 'ribbon', points: 1 },
];
const BAD_ITEMS = [
  { emoji: '💧', label: 'rain', damage: 1 },
  { emoji: '☁️', label: 'cloud', damage: 1 },
  { emoji: '😢', label: 'sad', damage: 2 },
];

let items = [];
let itemSpawnTimer = 0;
let itemSpawnRate = 35;

function spawnItem() {
  const isGood = Math.random() < 0.7;
  const pool = isGood ? GOOD_ITEMS : BAD_ITEMS;
  const template = pool[Math.floor(Math.random() * pool.length)];
  items.push({
    x: W * 0.1 + Math.random() * W * 0.8,
    y: -30,
    size: 22 + Math.random() * 16,
    speed: 1.2 + Math.random() * 2.5,
    wobble: Math.random() * Math.PI * 2,
    wobbleSpeed: 0.02 + Math.random() * 0.04,
    wobbleAmp: 0.3 + Math.random() * 0.8,
    type: isGood ? 'good' : 'bad',
    template: template,
  });
}

// ═══════════════════════════════════════
//  BUBU POWER-UP
// ═══════════════════════════════════════
let bubu = null;
let bubuTimer = 0;
const BUBU_INTERVAL = 550;

function spawnBubu() {
  bubu = {
    x: W + 100,
    y: H * 0.2 + Math.random() * H * 0.35,
    type: Math.random() < 0.5 ? 'shield' : 'magnet',
    w: 70, h: 80,
  };
  bubuSprite.style.display = 'block';
  bubuSprite.src = bubuImgs[0];
  bubuIdx = 0;
  updateBubuSprite();
}

function updateBubuSprite() {
  if (!bubu) { bubuSprite.style.display = 'none'; bubuLabel.style.display = 'none'; return; }
  bubuSprite.style.width = bubu.w + 'px';
  bubuSprite.style.height = bubu.h + 'px';
  bubuSprite.style.left = (bubu.x - bubu.w / 2) + 'px';
  bubuSprite.style.top = (bubu.y - bubu.h / 2) + 'px';

  bubuLabel.style.display = 'block';
  bubuLabel.style.left = (bubu.x - 30) + 'px';
  bubuLabel.style.top = (bubu.y - bubu.h / 2 - 22) + 'px';
  bubuLabel.style.width = '60px';
  bubuLabel.textContent = bubu.type === 'shield' ? '🛡️护盾' : '🧲磁铁';
}

// ═══════════════════════════════════════
//  PARTICLES (Canvas)
// ═══════════════════════════════════════
let particles = [];

function spawnParticles(x, y, color, count = 10) {
  for (let i = 0; i < count; i++) {
    particles.push({
      x, y,
      vx: -2 + Math.random() * 4,
      vy: -3 - Math.random() * 4,
      life: 1,
      decay: 0.02 + Math.random() * 0.04,
      color, size: 2 + Math.random() * 4,
    });
  }
}

// ═══════════════════════════════════════
//  CLOUDS (Canvas background)
// ═══════════════════════════════════════
let clouds = [];
function initClouds() {
  clouds = [];
  for (let i = 0; i < 6; i++) {
    clouds.push({
      x: Math.random() * W,
      y: Math.random() * H * 0.55,
      w: 40 + Math.random() * 80,
      h: 20 + Math.random() * 30,
      speed: 0.3 + Math.random() * 0.5,
      alpha: 0.12 + Math.random() * 0.18,
    });
  }
}

// ═══════════════════════════════════════
//  INPUT
// ═══════════════════════════════════════
let keys = { left: false, right: false };
let touchActive = false;
let touchX = 0;

window.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
  if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
  if (gameState === STATE.IDLE && (e.key === ' ' || e.key === 'Enter')) startGame();
});
window.addEventListener('keyup', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
  if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
});

container.addEventListener('touchstart', e => {
  e.preventDefault();
  initAudio();
  if (gameState === STATE.IDLE) { startGame(); return; }
  if (gameState === STATE.OVER) { restartGame(); return; }
  touchActive = true;
  touchX = e.touches[0].clientX - container.getBoundingClientRect().left;
  player.targetX = (touchX / W) * W;
});
container.addEventListener('touchmove', e => {
  e.preventDefault();
  if (!touchActive) return;
  touchX = e.touches[0].clientX - container.getBoundingClientRect().left;
  player.targetX = (touchX / W) * W;
});
container.addEventListener('touchend', () => { touchActive = false; });

container.addEventListener('mousedown', e => {
  initAudio();
  if (gameState === STATE.IDLE) { startGame(); return; }
  if (gameState === STATE.OVER) { restartGame(); return; }
  touchActive = true;
  player.targetX = e.clientX - container.getBoundingClientRect().left;
});
container.addEventListener('mousemove', e => {
  if (!touchActive) return;
  player.targetX = e.clientX - container.getBoundingClientRect().left;
});
container.addEventListener('mouseup', () => { touchActive = false; });

// ═══════════════════════════════════════
//  GAME LOGIC
// ═══════════════════════════════════════
function startGame() {
  initAudio();
  resize();
  gameState = STATE.PLAYING;
  score = 0;
  lives = 3;
  invincible = 0;
  items = [];
  particles = [];
  bubu = null;
  bubuTimer = 0;
  itemSpawnTimer = 0;
  itemSpawnRate = 35;
  animTimer = 0;
  resetPlayer();
  initClouds();
  bubuSprite.style.display = 'none';
  bubuLabel.style.display = 'none';
  document.getElementById('start-screen').classList.add('hidden');
  document.getElementById('game-over').classList.remove('active');
  updateHUD();
}

function restartGame() { startGame(); }

function endGame() {
  gameState = STATE.OVER;
  sfxGameOver();
  if (score > highScore) {
    highScore = score;
    localStorage.setItem('bubu_highscore', highScore);
  }
  playerSprite.style.opacity = '1';
  bubuSprite.style.display = 'none';
  bubuLabel.style.display = 'none';
  document.getElementById('final-score').textContent = score;
  document.getElementById('high-score-text').textContent = '最高纪录：' + highScore;
  document.getElementById('game-over').classList.add('active');
}

function updateHUD() {
  hudScore.textContent = '💛 ' + score;
  let hearts = '';
  for (let i = 0; i < lives; i++) hearts += '❤️';
  for (let i = lives; i < 3; i++) hearts += '🖤';
  hudLives.textContent = hearts;
  hudShield.textContent = (invincible > 0) ? '🛡️ ' + Math.ceil(invincible / 60) + 's' : '';
}

function update() {
  if (gameState !== STATE.PLAYING) return;
  frame++;
  animTimer++;

  // Animate character frames (swap every 30 frames / 0.5s)
  if (animTimer % 30 === 0) switchPlayerFrame();
  if (bubu && animTimer % 25 === 0) switchBubuFrame();

  // Move player
  if (keys.left || keys.right) {
    touchActive = false;
    if (keys.left) player.targetX = Math.max(0, player.x - player.speed * 3.5);
    if (keys.right) player.targetX = Math.min(W, player.x + player.speed * 3.5);
  }
  const dx = player.targetX - player.x;
  player.x += dx * 0.22;
  player.x = Math.max(player.w / 2, Math.min(W - player.w / 2, player.x));

  // Player facing direction
  playerSprite.style.transform = (dx < -0.5) ? 'scaleX(-1)' : (dx > 0.5 ? 'scaleX(1)' : playerSprite.style.transform);

  updatePlayerSprite();

  // Spawn items
  itemSpawnTimer++;
  if (itemSpawnTimer >= itemSpawnRate) {
    itemSpawnTimer = 0;
    spawnItem();
    if (frame % 300 === 0 && itemSpawnRate > 18) itemSpawnRate--;
  }

  // Update items
  for (let item of items) {
    item.y += item.speed;
    item.wobble += item.wobbleSpeed;
    item.x += Math.sin(item.wobble) * item.wobbleAmp;
    item.x = Math.max(item.size / 2, Math.min(W - item.size / 2, item.x));

    // Collision with player
    const px = player.x, py = player.y;
    const pw = player.w * 0.5, ph = player.h * 0.5;
    if (item.x > px - pw && item.x < px + pw && item.y > py - ph && item.y < py + ph) {
      if (item.type === 'good') {
        score += item.template.points;
        sfxCollect();
        spawnParticles(item.x, item.y, '#ffb8c6', 8);
      } else {
        if (invincible <= 0) {
          lives -= item.template.damage;
          sfxHit();
          spawnParticles(item.x, item.y, '#8899bb', 12);
          invincible = 90;
          if (lives <= 0) { lives = 0; endGame(); return; }
        }
      }
      item.y = H + 100; // mark for removal
    }
  }
  items = items.filter(item => item.y < H + 60);

  // Invincibility
  if (invincible > 0) invincible--;

  // Bubu
  if (!bubu) {
    bubuTimer++;
    if (bubuTimer >= BUBU_INTERVAL) {
      bubuTimer = 0;
      spawnBubu();
    }
  } else {
    bubu.x -= 1.6;
    updateBubuSprite();

    const px = player.x, py = player.y;
    if (Math.abs(bubu.x - px) < 55 && Math.abs(bubu.y - py) < 60) {
      sfxPowerUp();
      if (bubu.type === 'shield') {
        invincible = 300;
        spawnParticles(bubu.x, bubu.y, '#87ceeb', 20);
      } else {
        items.forEach(it => {
          if (it.type === 'bad') {
            it.type = 'good';
            it.template = GOOD_ITEMS[Math.floor(Math.random() * GOOD_ITEMS.length)];
          }
        });
        spawnParticles(bubu.x, bubu.y, '#ffd700', 20);
      }
      bubu = null;
      bubuSprite.style.display = 'none';
      bubuLabel.style.display = 'none';
    } else if (bubu.x < -80) {
      bubu = null;
      bubuSprite.style.display = 'none';
      bubuLabel.style.display = 'none';
    }
  }

  // Particles
  for (let p of particles) { p.x += p.vx; p.y += p.vy; p.life -= p.decay; }
  particles = particles.filter(p => p.life > 0);

  // Clouds
  for (let c of clouds) { c.x += c.speed; if (c.x > W + c.w) c.x = -c.w; }

  updateHUD();
}

// ═══════════════════════════════════════
//  CANVAS RENDER (background + items)
// ═══════════════════════════════════════
function render() {
  ctx.clearRect(0, 0, W, H);

  // Clouds
  for (let c of clouds) {
    ctx.fillStyle = `rgba(255,255,255,${c.alpha})`;
    ctx.beginPath();
    ctx.ellipse(c.x, c.y, c.w / 2, c.h / 2, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath();
    ctx.ellipse(c.x - c.w * 0.25, c.y + c.h * 0.1, c.w * 0.3, c.h * 0.35, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath();
    ctx.ellipse(c.x + c.w * 0.25, c.y + c.h * 0.05, c.w * 0.3, c.h * 0.35, 0, 0, Math.PI * 2); ctx.fill();
  }

  // Ground
  ctx.fillStyle = '#e8d8d8';
  ctx.fillRect(0, H * 0.93, W, H * 0.07);
  const grad = ctx.createLinearGradient(0, H * 0.92, 0, H * 0.94);
  grad.addColorStop(0, 'rgba(200,170,170,0)');
  grad.addColorStop(0.5, 'rgba(200,170,170,0.4)');
  grad.addColorStop(1, 'rgba(200,170,170,0)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, H * 0.92, W, H * 0.02);

  // Items
  for (let item of items) {
    ctx.save();
    if (item.type === 'bad') {
      ctx.fillStyle = 'rgba(0,0,0,0.06)';
      ctx.beginPath();
      ctx.arc(item.x, item.y, item.size * 0.5, 0, Math.PI * 2); ctx.fill();
    }
    ctx.font = `${item.size}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(item.template.emoji, item.x, item.y);
    ctx.restore();
  }

  // Particles
  for (let p of particles) {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// ═══════════════════════════════════════
//  GAME LOOP
// ═══════════════════════════════════════
function gameLoop() {
  update();
  render();
  requestAnimationFrame(gameLoop);
}

// ═══════════════════════════════════════
//  INIT
// ═══════════════════════════════════════
resetPlayer();
initClouds();
bubuSprite.style.display = 'none';
bubuLabel.style.display = 'none';
document.getElementById('high-score-text').textContent = '最高纪录：' + highScore;
resize();
gameLoop();
</script>
