<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>一二布布 · 常想一二</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #fce4ec;
  overflow: hidden;
  height: 100vh; width: 100vw;
  font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  touch-action: none;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
  display: flex; align-items: center; justify-content: center;
}
canvas { display: block; max-width: 100vw; max-height: 100vh; }

/* Overlay screens */
.overlay {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  pointer-events: none; z-index: 10;
}
.overlay.active { pointer-events: auto; }

#start-screen {
  background: rgba(255,235,238,0.92);
  text-align: center;
  transition: opacity 0.5s;
}
#start-screen.hidden { opacity: 0; pointer-events: none; }
#start-screen h1 {
  font-size: clamp(2rem, 6vw, 3.5rem);
  color: #d4687a;
  margin-bottom: 0.3em;
  text-shadow: 2px 2px 0 rgba(255,255,255,0.8);
}
#start-screen .sub {
  font-size: clamp(0.9rem, 2.5vw, 1.3rem);
  color: #b0806a;
  margin-bottom: 1em;
}
#start-screen .chars {
  font-size: clamp(3rem, 10vw, 6rem);
  margin-bottom: 0.3em;
}
#start-screen .meaning {
  font-size: clamp(0.7rem, 2vw, 1rem);
  color: #c09080;
  max-width: 80%;
  line-height: 1.8;
  margin-bottom: 1.5em;
}
#start-btn {
  padding: 14px 50px; font-size: 1.3rem;
  background: linear-gradient(135deg, #f8a4b8, #e8788a);
  color: #fff; border: none; border-radius: 50px;
  cursor: pointer; letter-spacing: 0.2em;
  box-shadow: 0 4px 20px rgba(232,120,138,0.4);
  transition: transform 0.2s, box-shadow 0.2s;
  font-family: inherit;
}
#start-btn:hover { transform: scale(1.05); box-shadow: 0 6px 28px rgba(232,120,138,0.5); }
#start-btn:active { transform: scale(0.97); }

#game-over {
  background: rgba(255,235,238,0.9);
  text-align: center;
  opacity: 0; transition: opacity 0.6s;
}
#game-over.active { opacity: 1; pointer-events: auto; }
#game-over h2 {
  font-size: clamp(1.5rem, 5vw, 2.5rem);
  color: #d4687a; margin-bottom: 0.3em;
}
#game-over .score-final {
  font-size: clamp(2rem, 8vw, 4rem);
  color: #b05060; font-weight: bold;
  margin-bottom: 0.2em;
}
#game-over .score-label { color: #b0806a; font-size: 0.9rem; margin-bottom: 0.5em; }
#game-over .high-score { color: #c08070; font-size: 0.85rem; margin-bottom: 1.2em; }
#restart-btn {
  padding: 12px 40px; font-size: 1.1rem;
  background: linear-gradient(135deg, #f8a4b8, #e8788a);
  color: #fff; border: none; border-radius: 50px;
  cursor: pointer; letter-spacing: 0.15em;
  box-shadow: 0 4px 16px rgba(232,120,138,0.4);
  transition: transform 0.2s;
  font-family: inherit;
}
#restart-btn:hover { transform: scale(1.05); }
#restart-btn:active { transform: scale(0.97); }
</style>
</head>
<body>

<canvas id="game"></canvas>

<!-- Start Screen -->
<div id="start-screen" class="overlay active">
  <div class="chars">🐼🐻</div>
  <h1>常想一二</h1>
  <p class="sub">一二布布 · 治愈小游戏</p>
  <p class="meaning">人生不如意十之八九<br>常想一二，不思八九</p>
  <button id="start-btn" onclick="startGame()">开 始 游 戏</button>
</div>

<!-- Game Over -->
<div id="game-over" class="overlay">
  <h2>游戏结束</h2>
  <div class="score-final" id="final-score">0</div>
  <div class="score-label">收集的幸福</div>
  <div class="high-score" id="high-score-text">最高纪录：0</div>
  <button id="restart-btn" onclick="restartGame()">再 来 一 次</button>
</div>

<script>
// ═══════════════════════════════════════
//  CANVAS SETUP
// ═══════════════════════════════════════
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W, H, scale;

function resize() {
  const maxW = Math.min(window.innerWidth, 500);
  const maxH = Math.min(window.innerHeight, 850);
  const ratio = 500 / 850;
  if (maxW / maxH > ratio) {
    H = maxH; W = H * ratio;
  } else {
    W = maxW; H = W / ratio;
  }
  canvas.width = W;
  canvas.height = H;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
}
resize();
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 200));

// ═══════════════════════════════════════
//  SOUND (Web Audio API oscillators)
// ═══════════════════════════════════════
let audioCtx = null;
function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

function playSound(freq, type, duration, vol = 0.1) {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t);
  gain.gain.setValueAtTime(vol, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + duration);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(t);
  osc.stop(t + duration);
}

function sfxCollect() { playSound(880, 'sine', 0.15); setTimeout(() => playSound(1100, 'sine', 0.12), 80); }
function sfxHit() { playSound(150, 'triangle', 0.25, 0.08); }
function sfxPowerUp() { playSound(660, 'sine', 0.1); setTimeout(() => playSound(880, 'sine', 0.1), 100); setTimeout(() => playSound(1100, 'sine', 0.15), 200); }
function sfxGameOver() { playSound(200, 'sawtooth', 0.4, 0.06); setTimeout(() => playSound(150, 'sawtooth', 0.5, 0.06), 200); }

// ═══════════════════════════════════════
//  GAME STATE
// ═══════════════════════════════════════
const STATE = { IDLE: 0, PLAYING: 1, OVER: 2 };
let gameState = STATE.IDLE;
let score = 0;
let lives = 3;
let highScore = parseInt(localStorage.getItem('bubu_highscore') || '0');
let frame = 0;
let invincible = 0;

// ═══════════════════════════════════════
//  CHARACTER DRAWING
// ═══════════════════════════════════════
function drawYier(x, y, s) {
  // s = scale (size)
  ctx.save();
  ctx.translate(x, y);

  // Left foot
  ctx.fillStyle = '#2a2a2a';
  ctx.beginPath(); ctx.ellipse(-s * 0.18, s * 0.45, s * 0.13, s * 0.09, 0, 0, Math.PI * 2); ctx.fill();
  // Right foot
  ctx.beginPath(); ctx.ellipse(s * 0.18, s * 0.45, s * 0.13, s * 0.09, 0, 0, Math.PI * 2); ctx.fill();

  // Body (white round)
  ctx.fillStyle = '#fefefe';
  ctx.beginPath(); ctx.ellipse(0, 0, s * 0.35, s * 0.4, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#e8e0e0'; ctx.lineWidth = s * 0.02;
  ctx.beginPath(); ctx.ellipse(0, 0, s * 0.35, s * 0.4, 0, 0, Math.PI * 2); ctx.stroke();

  // Ears (black round)
  ctx.fillStyle = '#1a1a1a';
  ctx.beginPath(); ctx.ellipse(-s * 0.22, -s * 0.3, s * 0.12, s * 0.13, -0.3, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(s * 0.22, -s * 0.3, s * 0.12, s * 0.13, 0.3, 0, Math.PI * 2); ctx.fill();

  // Inner ear pink
  ctx.fillStyle = '#f8c8d0';
  ctx.beginPath(); ctx.ellipse(-s * 0.22, -s * 0.3, s * 0.06, s * 0.07, -0.3, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(s * 0.22, -s * 0.3, s * 0.06, s * 0.07, 0.3, 0, Math.PI * 2); ctx.fill();

  // Bow tie
  ctx.fillStyle = '#1a1a1a';
  ctx.beginPath(); ctx.moveTo(0, -s * 0.02); ctx.lineTo(-s * 0.18, -s * 0.1); ctx.lineTo(-s * 0.18, s * 0.06); ctx.lineTo(0, -s * 0.02); ctx.fill();
  ctx.beginPath(); ctx.moveTo(0, -s * 0.02); ctx.lineTo(s * 0.18, -s * 0.1); ctx.lineTo(s * 0.18, s * 0.06); ctx.lineTo(0, -s * 0.02); ctx.fill();
  ctx.beginPath(); ctx.arc(0, -s * 0.02, s * 0.05, 0, Math.PI * 2); ctx.fill();

  // Eyes
  ctx.fillStyle = '#1a1a1a';
  ctx.beginPath(); ctx.arc(-s * 0.1, -s * 0.05, s * 0.04, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(s * 0.1, -s * 0.05, s * 0.04, 0, Math.PI * 2); ctx.fill();
  // Eye shine
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(-s * 0.09, -s * 0.07, s * 0.015, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(s * 0.11, -s * 0.07, s * 0.015, 0, Math.PI * 2); ctx.fill();

  // Blush
  ctx.fillStyle = 'rgba(255,180,180,0.5)';
  ctx.beginPath(); ctx.ellipse(-s * 0.2, s * 0.05, s * 0.08, s * 0.05, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(s * 0.2, s * 0.05, s * 0.08, s * 0.05, 0, 0, Math.PI * 2); ctx.fill();

  // Mouth (tiny smile)
  ctx.strokeStyle = '#c09090'; ctx.lineWidth = s * 0.015;
  ctx.beginPath(); ctx.arc(0, s * 0.02, s * 0.06, 0.1, Math.PI - 0.1); ctx.stroke();

  ctx.restore();
}

function drawBubu(x, y, s) {
  ctx.save();
  ctx.translate(x, y);

  // Feet
  ctx.fillStyle = '#5a3a28';
  ctx.beginPath(); ctx.ellipse(-s * 0.18, s * 0.45, s * 0.14, s * 0.1, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(s * 0.18, s * 0.45, s * 0.14, s * 0.1, 0, 0, Math.PI * 2); ctx.fill();

  // Body (brown)
  ctx.fillStyle = '#c48b5c';
  ctx.beginPath(); ctx.ellipse(0, 0, s * 0.35, s * 0.4, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#a07040'; ctx.lineWidth = s * 0.02;
  ctx.beginPath(); ctx.ellipse(0, 0, s * 0.35, s * 0.4, 0, 0, Math.PI * 2); ctx.stroke();

  // Belly patch
  ctx.fillStyle = '#f5e0c8';
  ctx.beginPath(); ctx.ellipse(0, s * 0.08, s * 0.2, s * 0.22, 0, 0, Math.PI * 2); ctx.fill();

  // Ears (round brown)
  ctx.fillStyle = '#a06840';
  ctx.beginPath(); ctx.arc(-s * 0.22, -s * 0.3, s * 0.13, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(s * 0.22, -s * 0.3, s * 0.13, 0, Math.PI * 2); ctx.fill();
  // Inner ear
  ctx.fillStyle = '#d4a880';
  ctx.beginPath(); ctx.arc(-s * 0.22, -s * 0.3, s * 0.07, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(s * 0.22, -s * 0.3, s * 0.07, 0, Math.PI * 2); ctx.fill();

  // Eyes (gentle)
  ctx.fillStyle = '#3a2010';
  ctx.beginPath(); ctx.arc(-s * 0.1, -s * 0.06, s * 0.04, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(s * 0.1, -s * 0.06, s * 0.04, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(-s * 0.09, -s * 0.08, s * 0.015, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(s * 0.11, -s * 0.08, s * 0.015, 0, Math.PI * 2); ctx.fill();

  // Nose
  ctx.fillStyle = '#5a3020';
  ctx.beginPath(); ctx.arc(0, s * 0.0, s * 0.04, 0, Math.PI * 2); ctx.fill();

  // Gentle smile
  ctx.strokeStyle = '#7a5040'; ctx.lineWidth = s * 0.015;
  ctx.beginPath(); ctx.arc(0, s * 0.04, s * 0.08, 0.1, Math.PI - 0.1); ctx.stroke();

  // Blush
  ctx.fillStyle = 'rgba(200,150,130,0.4)';
  ctx.beginPath(); ctx.ellipse(-s * 0.22, s * 0.05, s * 0.07, s * 0.04, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(s * 0.22, s * 0.05, s * 0.07, s * 0.04, 0, 0, Math.PI * 2); ctx.fill();

  ctx.restore();
}

// ═══════════════════════════════════════
//  PLAYER (一二)
// ═══════════════════════════════════════
const player = {
  x: 0, y: 0, w: 0, h: 0,
  baseSize: 45,
  speed: 0,
  targetX: 0,
};
let playerScale = 1;

function resetPlayer() {
  player.x = W / 2;
  player.y = H * 0.85;
  player.w = player.baseSize * 1.4;
  player.h = player.baseSize * 1.6;
  player.speed = W * 0.008;
  player.targetX = player.x;
}

// ═══════════════════════════════════════
//  FALLING ITEMS
// ═══════════════════════════════════════
const GOOD_ITEMS = [
  { emoji: '❤️', label: 'heart', points: 1 },
  { emoji: '⭐', label: 'star', points: 2 },
  { emoji: '🌸', label: 'flower', points: 1 },
  { emoji: '🍀', label: 'clover', points: 3 },
  { emoji: '🎀', label: 'ribbon', points: 1 },
];
const BAD_ITEMS = [
  { emoji: '💧', label: 'rain', damage: 1 },
  { emoji: '☁️', label: 'cloud', damage: 1 },
  { emoji: '😢', label: 'sad', damage: 2 },
];

let items = [];
let itemSpawnTimer = 0;
let itemSpawnRate = 35; // frames between spawns

function spawnItem() {
  const isGood = Math.random() < 0.7; // 70% good, 30% bad
  const pool = isGood ? GOOD_ITEMS : BAD_ITEMS;
  const template = pool[Math.floor(Math.random() * pool.length)];

  items.push({
    x: W * 0.1 + Math.random() * W * 0.8,
    y: -30,
    size: 24 + Math.random() * 16,
    speed: 1.2 + Math.random() * 2.5,
    wobble: Math.random() * Math.PI * 2,
    wobbleSpeed: 0.02 + Math.random() * 0.04,
    wobbleAmp: 0.3 + Math.random() * 0.8,
    type: isGood ? 'good' : 'bad',
    template: template,
    collected: false,
    alpha: 1,
  });
}

// ═══════════════════════════════════════
//  BUBU POWER-UP
// ═══════════════════════════════════════
let bubu = null; // { x, y, alpha, type }
let bubuTimer = 0;
const BUBU_INTERVAL = 600; // frames (~10 sec at 60fps)

function spawnBubu() {
  bubu = {
    x: W + 80,
    y: H * 0.25 + Math.random() * H * 0.3,
    alpha: 1,
    type: Math.random() < 0.5 ? 'shield' : 'magnet',
    size: 40,
  };
}

// ═══════════════════════════════════════
//  PARTICLES
// ═══════════════════════════════════════
let particles = [];

function spawnParticles(x, y, color, count = 10) {
  for (let i = 0; i < count; i++) {
    particles.push({
      x, y,
      vx: -2 + Math.random() * 4,
      vy: -3 - Math.random() * 4,
      life: 1,
      decay: 0.02 + Math.random() * 0.04,
      color,
      size: 2 + Math.random() * 4,
    });
  }
}

// ═══════════════════════════════════════
//  FLOATING CLOUDS (background)
// ═══════════════════════════════════════
let clouds = [];
function initClouds() {
  clouds = [];
  for (let i = 0; i < 6; i++) {
    clouds.push({
      x: Math.random() * W,
      y: Math.random() * H * 0.6,
      w: 40 + Math.random() * 80,
      h: 20 + Math.random() * 30,
      speed: 0.3 + Math.random() * 0.5,
      alpha: 0.15 + Math.random() * 0.2,
    });
  }
}
initClouds();

// ═══════════════════════════════════════
//  INPUT HANDLING
// ═══════════════════════════════════════
let keys = { left: false, right: false };
let touchActive = false;
let touchX = 0;

window.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
  if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
  if (gameState === STATE.IDLE && (e.key === ' ' || e.key === 'Enter')) startGame();
});
window.addEventListener('keyup', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
  if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
});

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  initAudio();
  if (gameState === STATE.IDLE) { startGame(); return; }
  if (gameState === STATE.OVER) { restartGame(); return; }
  touchActive = true;
  const rect = canvas.getBoundingClientRect();
  touchX = (e.touches[0].clientX - rect.left) * (W / rect.width);
  player.targetX = touchX;
});
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (!touchActive) return;
  const rect = canvas.getBoundingClientRect();
  touchX = (e.touches[0].clientX - rect.left) * (W / rect.width);
  player.targetX = touchX;
});
canvas.addEventListener('touchend', () => { touchActive = false; });

canvas.addEventListener('mousedown', e => {
  initAudio();
  if (gameState === STATE.IDLE) { startGame(); return; }
  if (gameState === STATE.OVER) { restartGame(); return; }
  touchActive = true;
  const rect = canvas.getBoundingClientRect();
  player.targetX = (e.clientX - rect.left) * (W / rect.width);
});
canvas.addEventListener('mousemove', e => {
  if (!touchActive) return;
  const rect = canvas.getBoundingClientRect();
  player.targetX = (e.clientX - rect.left) * (W / rect.width);
});
canvas.addEventListener('mouseup', () => { touchActive = false; });

// ═══════════════════════════════════════
//  GAME LOGIC
// ═══════════════════════════════════════
function startGame() {
  initAudio();
  gameState = STATE.PLAYING;
  score = 0;
  lives = 3;
  invincible = 0;
  items = [];
  particles = [];
  bubu = null;
  bubuTimer = 0;
  itemSpawnTimer = 0;
  itemSpawnRate = 35;
  resetPlayer();
  document.getElementById('start-screen').classList.add('hidden');
  document.getElementById('game-over').classList.remove('active');
}

function restartGame() { startGame(); }

function endGame() {
  gameState = STATE.OVER;
  sfxGameOver();
  if (score > highScore) {
    highScore = score;
    localStorage.setItem('bubu_highscore', highScore);
  }
  document.getElementById('final-score').textContent = score;
  document.getElementById('high-score-text').textContent = '最高纪录：' + highScore;
  document.getElementById('game-over').classList.add('active');
}

function update() {
  if (gameState !== STATE.PLAYING) return;
  frame++;

  // Move player
  if (keys.left || keys.right) {
    touchActive = false;
    if (keys.left) player.targetX = player.x - player.speed * 3;
    if (keys.right) player.targetX = player.x + player.speed * 3;
  }
  // Smooth follow
  const dx = player.targetX - player.x;
  player.x += dx * 0.2;
  // Clamp
  player.x = Math.max(player.w / 2, Math.min(W - player.w / 2, player.x));

  // Spawn items
  itemSpawnTimer++;
  if (itemSpawnTimer >= itemSpawnRate) {
    itemSpawnTimer = 0;
    spawnItem();
    // Gradually increase difficulty
    if (frame % 300 === 0 && itemSpawnRate > 18) itemSpawnRate--;
  }

  // Update items
  for (let item of items) {
    item.y += item.speed;
    item.wobble += item.wobbleSpeed;
    item.x += Math.sin(item.wobble) * item.wobbleAmp;
    item.x = Math.max(item.size / 2, Math.min(W - item.size / 2, item.x));

    // Collision with player
    if (!item.collected) {
      const px = player.x, py = player.y;
      const pw = player.w * 0.6, ph = player.h * 0.6;
      const ix = item.x, iy = item.y, is = item.size;

      if (ix > px - pw && ix < px + pw && iy > py - ph && iy < py + ph) {
        item.collected = true;
        if (item.type === 'good') {
          if (invincible <= 0) {
            score += item.template.points;
            sfxCollect();
            spawnParticles(item.x, item.y, '#ffb8c6', 8);
          }
        } else {
          if (invincible <= 0) {
            lives -= item.template.damage;
            sfxHit();
            spawnParticles(item.x, item.y, '#8899bb', 12);
            invincible = 90; // 1.5 sec invincibility
            if (lives <= 0) { lives = 0; endGame(); return; }
          }
        }
      }
    }
  }

  // Clean up off-screen / collected items
  items = items.filter(item => item.y < H + 60 && !item.collected);

  // Invincibility countdown
  if (invincible > 0) invincible--;

  // Bubu power-up
  if (!bubu) {
    bubuTimer++;
    if (bubuTimer >= BUBU_INTERVAL) {
      bubuTimer = 0;
      spawnBubu();
    }
  } else {
    bubu.x -= 1.8;
    // Check collision with player
    const px = player.x, py = player.y;
    if (Math.abs(bubu.x - px) < 50 && Math.abs(bubu.y - py) < 50) {
      sfxPowerUp();
      if (bubu.type === 'shield') {
        invincible = 300; // 5 sec shield
        spawnParticles(bubu.x, bubu.y, '#87ceeb', 20);
      } else {
        // Magnet: convert all current bad items to good
        items.forEach(it => {
          if (it.type === 'bad') {
            it.type = 'good';
            it.template = GOOD_ITEMS[Math.floor(Math.random() * GOOD_ITEMS.length)];
          }
        });
        spawnParticles(bubu.x, bubu.y, '#ffd700', 20);
      }
      bubu = null;
    } else if (bubu.x < -60) {
      bubu = null;
    }
  }

  // Update particles
  for (let p of particles) {
    p.x += p.vx;
    p.y += p.vy;
    p.life -= p.decay;
  }
  particles = particles.filter(p => p.life > 0);

  // Update clouds
  for (let c of clouds) {
    c.x += c.speed;
    if (c.x > W + c.w) c.x = -c.w;
  }
}

// ═══════════════════════════════════════
//  RENDER
// ═══════════════════════════════════════
function drawBackground() {
  // Sky gradient
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#e8f4f8');
  grad.addColorStop(0.5, '#fce4ec');
  grad.addColorStop(1, '#f8e8f0');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Clouds
  for (let c of clouds) {
    ctx.fillStyle = `rgba(255,255,255,${c.alpha})`;
    ctx.beginPath();
    ctx.ellipse(c.x, c.y, c.w / 2, c.h / 2, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(c.x - c.w * 0.25, c.y + c.h * 0.1, c.w * 0.3, c.h * 0.35, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(c.x + c.w * 0.25, c.y + c.h * 0.05, c.w * 0.3, c.h * 0.35, 0, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawGround() {
  // Soft ground
  ctx.fillStyle = '#e8d8d8';
  ctx.fillRect(0, H * 0.92, W, H * 0.08);
  // Gradient line
  const grad = ctx.createLinearGradient(0, H * 0.91, 0, H * 0.93);
  grad.addColorStop(0, 'rgba(200,170,170,0)');
  grad.addColorStop(0.5, 'rgba(200,170,170,0.5)');
  grad.addColorStop(1, 'rgba(200,170,170,0)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, H * 0.91, W, H * 0.02);
}

function drawHUD() {
  // Score
  ctx.fillStyle = '#c07080';
  ctx.font = `bold ${W * 0.045}px "PingFang SC","Microsoft YaHei",sans-serif`;
  ctx.textAlign = 'left';
  ctx.fillText('💛 ' + score, 12, 35);

  // Lives
  ctx.textAlign = 'right';
  let heartsStr = '';
  for (let i = 0; i < lives; i++) heartsStr += '❤️';
  for (let i = lives; i < 3; i++) heartsStr += '🖤';
  ctx.font = `${W * 0.05}px sans-serif`;
  ctx.fillText(heartsStr, W - 12, 35);

  // Shield indicator
  if (invincible > 0) {
    ctx.fillStyle = 'rgba(135,206,235,0.6)';
    ctx.textAlign = 'center';
    ctx.font = `${W * 0.035}px "PingFang SC","Microsoft YaHei",sans-serif`;
    ctx.fillText('🛡️ 护盾 ' + Math.ceil(invincible / 60) + 's', W / 2, 35);
  }
}

function drawPlayer() {
  // Invincibility blink
  if (invincible > 0 && Math.floor(invincible / 6) % 2 === 0) return;
  drawYier(player.x, player.y, player.baseSize);
}

function drawItems() {
  for (let item of items) {
    ctx.save();
    ctx.globalAlpha = item.alpha;
    ctx.font = `${item.size}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    if (item.type === 'bad') {
      // Darker background for bad items
      ctx.fillStyle = 'rgba(0,0,0,0.08)';
      ctx.beginPath();
      ctx.arc(item.x, item.y, item.size * 0.55, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.fillText(item.template.emoji, item.x, item.y);
    ctx.restore();
  }
}

function drawBubuPowerUp() {
  if (!bubu) return;
  ctx.save();
  ctx.globalAlpha = bubu.alpha;
  drawBubu(bubu.x, bubu.y, bubu.size);

  // Label
  ctx.fillStyle = '#8b4513';
  ctx.font = `${W * 0.03}px "PingFang SC","Microsoft YaHei",sans-serif`;
  ctx.textAlign = 'center';
  const label = bubu.type === 'shield' ? '🛡️护盾' : '🧲磁铁';
  ctx.fillText(label, bubu.x, bubu.y - bubu.size * 0.6);

  ctx.restore();
}

function drawParticles() {
  for (let p of particles) {
    ctx.fillStyle = p.color.replace(')', `,${p.life})`).replace('rgb', 'rgba');
    if (p.color.startsWith('#')) {
      ctx.globalAlpha = p.life;
      ctx.fillStyle = p.color;
    }
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function render() {
  ctx.clearRect(0, 0, W, H);

  drawBackground();
  drawItems();
  drawPlayer();
  drawBubuPowerUp();
  drawParticles();
  drawGround();
  drawHUD();
}

// ═══════════════════════════════════════
//  GAME LOOP
// ═══════════════════════════════════════
function gameLoop() {
  update();
  render();
  requestAnimationFrame(gameLoop);
}

// ═══════════════════════════════════════
//  INIT
// ═══════════════════════════════════════
resetPlayer();
initClouds();
gameLoop();

// Show high score on start screen
document.getElementById('high-score-text').textContent = '最高纪录：' + highScore;
</script>
</body>
